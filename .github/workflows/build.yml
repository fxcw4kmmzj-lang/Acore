name: Build ACore

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o "ACore GitHub Repo.zip" -d repo
          cp -rv repo/. .
          rm "ACore GitHub Repo.zip"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: ACore
          path: build/libs/*.jar
